services:
  - type: web
    name: nerou-finder
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npx prisma generate && npm run build
    # NOTE: this used to also run `npx prisma migrate deploy` here, but that started
    # hard-failing every build with Prisma error P1013 ("scheme is not recognized in
    # database URL") even though DATABASE_URL/DIRECT_URL both looked correctly formatted
    # in the Render dashboard - couldn't be diagnosed further without direct access to the
    # raw env var values. Reverted to unblock deploys. Apply migrations manually and
    # separately instead, e.g. via Render's Shell tab: `npx prisma migrate deploy`
    # (running it there surfaces the real error without blocking an actual deploy while
    # you iterate on it).
    startCommand: npm start
    disk:
      name: uploads
      mountPath: /opt/render/project/src/assets/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        sync: false
