services:
  - type: web
    name: nerou-finder
    runtime: node
    plan: starter
    region: singapore
    # Migrations run as a pre-deploy step, not inside buildCommand. In the build they make a
    # database-side problem surface as "Build failed" with no artifact produced and nothing
    # pointing at migrations. Pre-deploy runs after the build and before the new version
    # takes traffic; a failure still aborts the deploy, so the live version is never
    # replaced by code whose migrations did not apply.
    #
    # The prisma CLI is a devDependency and is available here: npm 10 installs
    # devDependencies regardless of NODE_ENV, and pre-deploy runs against the built image.
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    disk:
      name: uploads
      mountPath: /opt/render/project/src/assets/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        sync: false
