<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Core SEO Meta Tags -->
    <!-- Positioning: verification, not luxury/AI. See commit history. -->
    <title>Nerou Finder | Verified Property Listings in Qatar</title>
    <meta name="description" content="Properties in Qatar from licence-verified agents, with availability confirmed before publishing. One unit, one listing. Published pricing for agents." />
    <!-- meta keywords intentionally absent. -->
    <meta name="author" content="Nerou Technology Services Trading" />
    <meta name="geo.region" content="QA" />
    <meta name="geo.placename" content="Doha" />
    <meta name="geo.position" content="25.2854;51.5310" />
    <meta name="ICBM" content="25.2854, 51.5310" />

    <!-- Canonical + og/twitter urls are rewritten per-route by server.ts. -->
    <link rel="canonical" href="https://www.neroufinder.com/" />

    <!-- Open Graph / Facebook Social Sharing -->
    <meta property="og:type" content="website" />
    
    <meta property="og:url" content="https://www.neroufinder.com/" />
    <meta property="og:title" content="Nerou Finder | Verified Property Listings in Qatar" />
    <meta property="og:description" content="Properties in Qatar from licence-verified agents, with availability confirmed before publishing. One unit, one listing." />
    <!-- TODO: replace with a purpose-made 1200x630 OG card; this one is 2.33:1. -->
    <meta property="og:image" content="https://www.neroufinder.com/assets/images/hero-doha-skyline.jpg" />
    <meta property="og:image:width" content="1915" />
    <meta property="og:image:height" content="821" />
    <meta property="og:image:alt" content="Nerou Finder - verified property listings in Qatar" />
    <meta property="og:locale" content="en_US" />
    <!-- Arabic lives at /ar/...; server.ts writes the language alternates (hreflang) per page. -->
    <meta property="og:locale:alternate" content="ar_QA" />
    <meta property="og:site_name" content="Nerou Finder" />

    <!-- Twitter Social Sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.neroufinder.com/" />
    <meta name="twitter:title" content="Nerou Finder | Verified Property Listings in Qatar" />
    <meta name="twitter:description" content="Properties in Qatar from licence-verified agents, with availability confirmed before publishing. One unit, one listing." />
    <meta name="twitter:image" content="https://www.neroufinder.com/assets/images/hero-doha-skyline.jpg" />

    <!-- Only the four weights src/ actually uses. Tajawal has no 600. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pages the server renders for search engines (see server.ts) carry their text inside #root. People
         should not see that text flash up before the app starts, so with JavaScript on it is hidden from
         the eye (still in the page for crawlers and screen readers) until the app has taken over - the app
         removes data-ssr on start. If the app never starts, it is revealed after 10 seconds. -->
    <script>
      document.documentElement.classList.add("js");
      setTimeout(function () {
        var r = document.getElementById("root");
        if (r && r.hasAttribute("data-ssr")) document.documentElement.classList.remove("js");
      }, 10000);
    </script>
    <style>
      .js #root[data-ssr] > main {
        position: absolute !important; width: 1px !important; height: 1px !important; margin: -1px !important;
        padding: 0 !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
      }
    </style>

    <!-- Loaded without blocking the first paint (a blocking stylesheet from another site cost over a
         second on a phone): the page paints in the fallback font, then the real fonts swap in. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=El+Messiri:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=El+Messiri:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" /></noscript>

    <!-- Favicon and Theme Colors -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#fcfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181c" media="(prefers-color-scheme: dark)" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nerou Finder" />

    <!-- Site-level schema; per-page schema is injected by server.ts. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.neroufinder.com/#organization",
          "name": "Nerou Finder",
          "legalName": "Nerou Technology Services Trading",
          "identifier": { "@type": "PropertyValue", "propertyID": "Commercial Registration (CR) No.", "value": "209013" },
          "email": "info@neroutechnologyservices.com",
          "url": "https://www.neroufinder.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.neroufinder.com/assets/icons/icon-512.png",
            "width": 512,
            "height": 512
          },
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Al Muntazah Commercial Center, Tower B",
            "addressLocality": "Doha",
            "addressCountry": "QA"
          },
          "areaServed": { "@type": "Country", "name": "Qatar" }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.neroufinder.com/#website",
          "url": "https://www.neroufinder.com/",
          "name": "Nerou Finder",
          "publisher": { "@id": "https://www.neroufinder.com/#organization" },
          "inLanguage": ["en", "ar"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.neroufinder.com/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>

    <div id="root"></div>

    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
